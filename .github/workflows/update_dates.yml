name: Update Dates

on:
  workflow_dispatch:

  schedule:
    - cron: "5 21 * * *"

jobs:
  update:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate dates
        run: python dates.py

      - name: Commit changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add dates.csv

          git diff --cached --quiet || git commit -m "Daily date update"

          git push
